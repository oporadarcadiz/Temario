[build]
  command = "rm -rf .netlify-dist && mkdir -p .netlify-dist && cp -R web/. .netlify-dist/ && sed -i 's#https://tema-1-parte-1.netlify.app/#/tema-1/#g' .netlify-dist/index.html && cp -R tema-1 .netlify-dist/tema-1 && mkdir -p .netlify-dist/tema-2/radar .netlify-dist/tema-2/extras && cp tema-2/radar/index.html .netlify-dist/tema-2/radar/index.html && cp tema-2/extras/index.html .netlify-dist/tema-2/extras/index.html && rm -rf .netlify-dist/seguridad .netlify-dist/migrations .netlify-dist/tests .netlify-dist/tema-1/seguridad .netlify-dist/tema-1/tests .netlify-dist/tema-1/admin && find .netlify-dist -type f '(' -iname '*.pdf' -o -iname '*.sql' -o -iname '*.md' -o -iname '*.ts' -o -iname '*.cjs' -o -iname '*.zip' -o -iname '*.bak' -o -iname '*.env' ')' -delete && test -z \"$(find .netlify-dist -type f '(' -iname '*.pdf' -o -iname '*.sql' -o -iname '*.md' -o -iname '*.ts' -o -iname '*.cjs' -o -iname '*.zip' -o -iname '*.bak' -o -iname '*.env' ')' -print -quit)\" && test -f .netlify-dist/tema-1/radar/index.html && test -f .netlify-dist/tema-2/radar/index.html && test -f .netlify-dist/tema-2/extras/index.html && test -f .netlify-dist/assets/convocatorias.json && test -f .netlify-dist/assets/preguntas.json && test -f .netlify-dist/assets/subalterno.json"
  publish = ".netlify-dist"
