[build]
  command = "rm -rf .netlify-dist && mkdir -p .netlify-dist && cp -R web/. .netlify-dist/ && sed -i 's#https://tema-1-parte-1.netlify.app/#/tema-1/#g' .netlify-dist/index.html && cp -R tema-1 .netlify-dist/tema-1 && mkdir -p .netlify-dist/tema-2/radar .netlify-dist/tema-2/extras && cp tema-2/radar/index.html .netlify-dist/tema-2/radar/index.html && cp tema-2/extras/index.html .netlify-dist/tema-2/extras/index.html && find .netlify-dist/tema-1 -type f -iname '*.pdf' -delete && test -z \"$(find .netlify-dist/tema-1 .netlify-dist/tema-2 -type f -iname '*.pdf' -print -quit)\""
  publish = ".netlify-dist"
