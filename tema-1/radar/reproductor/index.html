<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1f33"><title>Recurso de estudio · Tema 1 | OpoRadarCádiz</title><style>:root{--night:#0b1f33;--gold:#e5b84b;--ink:#16334c}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:var(--night);font:16px/1.6 system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--ink);padding:22px 14px}main{max-width:690px;margin:auto;padding:clamp(22px,5vw,38px);background:#faf8f2;border-radius:20px}h1{font-size:clamp(28px,5vw,37px);line-height:1.2;margin:8px 0 12px}.brand{font-weight:900;color:#ad811d;font-size:13px;letter-spacing:.11em}a{color:#11618f}a.button{display:inline-block;background:var(--night);color:white;padding:12px 16px;border-radius:10px;text-decoration:none;font-weight:800;margin-top:8px}.status{background:#e8f0f5;border-radius:10px;padding:16px;margin:18px 0}a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}</style></head><body><main><div class="brand">OPORADARCÁDIZ · RADAR DIGITAL</div><h1>Tu recurso de estudio</h1><p id="label">Biblioteca por tramos</p><div class="status" id="status" role="status" aria-live="polite">La entrega privada está en preparación. Esta dirección conserva su función sin exponer archivos ni enlaces temporales.</div><p><a class="button" id="catalog" href="../../videos/">Ver catálogo de vídeos →</a></p><p><a href="../">Volver al Radar Digital</a></p></main><script>const resource=new URLSearchParams(location.search).get('recurso')||'';const audio=/^audios\//i.test(resource);document.getElementById('catalog').href=audio?'../../audios/':'../../videos/';document.getElementById('catalog').textContent=audio?'Ver catálogo de pódcasts →':'Ver catálogo de vídeos →';if(resource)document.getElementById('label').textContent=audio?'Pódcasts por tramos':'Vídeos por tramos';</script></body></html>
