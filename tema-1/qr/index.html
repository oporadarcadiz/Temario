<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="index,follow"><title>Activar Radar · Tema 1 | OpoRadarCádiz</title>
<style>
:root{--navy:#0b1f33;--gold:#e5b84b;--green:#2e7d32;--blue:#1565c0;--red:#c62828;--paper:#faf8f3;--ink:#183047}*{box-sizing:border-box}
body{margin:0;background:var(--navy);color:var(--ink);font:16px/1.6 system-ui,-apple-system,Segoe UI,Arial,sans-serif}
main{width:min(800px,calc(100% - 32px));margin:24px auto 52px;background:var(--paper);border-radius:22px;padding:clamp(20px,5vw,46px);box-shadow:0 14px 44px #0004}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:1px solid #d7d7d3;padding-bottom:18px}
.brand{font-weight:900;color:var(--navy);font-size:22px;text-decoration:none}.brand span{color:#aa7a13}.top{color:#526473;font-size:13px}
h1{font-size:clamp(26px,5vw,42px);line-height:1.08;color:var(--navy);letter-spacing:-.04em;margin:22px 0 8px}
.intro{margin:0 0 22px;color:#506072}.progress{height:9px;background:#dce1e5;border-radius:20px;overflow:hidden}.fill{height:100%;width:0;background:var(--green)}
body.level2 .fill{background:var(--blue)}body.level3 .fill{background:var(--red)}
.panel{border:2px solid #d5dce1;border-left:9px solid var(--green);background:#fff;padding:22px;border-radius:16px;margin:20px 0}
body.level2 .panel{border-left-color:var(--blue)}body.level3 .panel{border-left-color:var(--red)}
.kicker{font-size:12px;text-transform:uppercase;letter-spacing:.12em;font-weight:800;color:#5c6872}
.question{font-size:clamp(19px,3.4vw,27px);font-weight:800;color:var(--navy);margin:12px 0 15px;line-height:1.28}
.answer{background:#ecf6ef;color:#154a28;border-radius:12px;padding:16px;white-space:pre-wrap}
button,.btn{font:inherit;cursor:pointer;border:0;border-radius:11px;min-height:48px;font-weight:800;padding:11px 16px;background:var(--navy);color:white}
button:focus-visible,a:focus-visible{outline:3px solid #e5b84b;outline-offset:3px}
button[disabled]{opacity:.55;cursor:not-allowed}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
.actions button{flex:1;min-width:110px}.bad{background:#b02d34}.doubt{background:#947019}.good{background:#287d4c}
.choices{display:grid;gap:10px}.choice{background:#f0f3f7;color:#172d40;text-align:left;border:2px solid #dce2e7}
.choice:hover:not(:disabled){background:#dceaf6}.choice.selected{background:#cde8d7;border-color:#287d4c}.choice.incorrect{background:#ffe4e4;border-color:#bb2735}
.hidden{display:none!important}.notice{padding:12px 15px;background:#fff2d6;border-radius:10px;margin:15px 0;color:#6a5011}
.summary{font-weight:700;font-size:20px}.muted{color:#61707e;font-size:13px}nav{display:flex;flex-wrap:wrap;gap:10px;border-top:1px solid #ddd;padding-top:18px;margin-top:26px}
nav a{padding:8px 12px;background:#ebedf2;border-radius:8px;color:#163952;font-weight:700;text-decoration:none}
@media(max-width:520px){main{padding:20px;margin-top:8px}.panel{padding:16px}.actions button{min-width:100px}}
</style></head>
<body><main><header><a class="brand" href="../">OpoRadar<span>Cádiz</span></a><span class="top">CONSTITUCIÓN · TEMA 1</span></header>
<h1 id="title"></h1><p class="intro" id="desc"></p>
<div class="progress" aria-label="Progreso"><div class="fill" id="fill"></div></div><p class="muted" id="counter" aria-live="polite"></p>
<section class="panel" id="panel"><span class="kicker" id="kind"></span><p class="question" id="question"></p><div class="choices hidden" id="choices"></div>
<div id="answer" class="answer hidden"></div><div class="actions" id="actions"></div></section>
<div id="feedback" class="notice hidden" aria-live="polite"></div>
<nav><a href="?nivel=1">Nivel 1 · Entender</a><a href="?nivel=2">Nivel 2 · Estudiar</a><a href="?nivel=3">Nivel 3 · Entrenar</a></nav>
<p class="muted">Actividades pedagógicas OpoRadarCádiz. Las preguntas del Nivel 3 son una muestra basada en el examen corregido del Ayuntamiento de Sanlúcar de Barrameda. No sustituyen al banco comercial de 100 preguntas.</p>
</main><script>
const DB={"1":[["¿Cuántos artículos tiene la Constitución?","169 artículos."],["¿Cuántos títulos numerados hay?","Diez: del I al X, además del Título Preliminar."],["¿Qué artículos forman el Título Preliminar?","Del 1 al 9."],["¿Qué fecha corresponde al referéndum constitucional?","6 de diciembre de 1978."],["¿Cuándo entró en vigor la Constitución?","29 de diciembre de 1978, día de su publicación en el BOE."],["¿Qué Título contiene los derechos y deberes fundamentales?","El Título I."],["¿Qué Título regula la Corona?","El Título II."],["¿Qué Título regula las Cortes Generales?","El Título III."],["¿Qué Título regula el Gobierno y la Administración?","El Título IV."],["¿Dónde se regula la organización territorial?","En el Título VIII."],["¿Qué Título regula el Tribunal Constitucional?","El Título IX."],["¿Qué significa 4-9-1-1?","4 disposiciones adicionales, 9 transitorias, 1 derogatoria y 1 final."]],"2":[["Artículo 1.1 · Valores superiores","Libertad, justicia, igualdad y pluralismo político."],["Artículo 1.2 · Soberanía","La soberanía nacional reside en el pueblo español."],["Artículo 1.3 · Forma política","Monarquía parlamentaria."],["Artículo 2 · Ideas clave","Unidad de la Nación española, autonomía de nacionalidades y regiones y solidaridad entre ellas."],["Artículo 3 · Lengua oficial","El castellano es la lengua española oficial del Estado; deber de conocerla y derecho a usarla."],["Artículo 5 · Capital","La capital del Estado es la villa de Madrid."],["Artículo 9.1 · Sujeción a la ley","Ciudadanos y poderes públicos están sujetos a la Constitución y al resto del ordenamiento jurídico."],["Artículo 14 · Igualdad","Los españoles son iguales ante la ley, sin discriminación por las circunstancias enumeradas en el artículo."],["Artículo 49 · Texto vigente","Se refiere a las personas con discapacidad, con especial protección de sus derechos y autonomía."],["Artículo 140 · Gobierno municipal","La Constitución garantiza la autonomía de los municipios; su gobierno y administración corresponden a los ayuntamientos."]],"3":[["¿De cuántos capítulos consta el Título I?","Cinco","Seis","Siete","Cuatro",0,"El Título I contiene cinco capítulos."],["¿Cuáles son los valores superiores del artículo 1.1?","Libertad, justicia, igualdad y pluralismo político","Libertad, justicia y cooperación","Solo los del artículo 14","Unidad de España exclusivamente",0,"El artículo 1.1 enumera cuatro valores superiores."],["¿Qué ocurrió el 6 de diciembre de 1978?","Se publicó en el BOE","El Rey sancionó la Constitución","La aprobaron las Cortes","Se celebró el referéndum de ratificación",3,"Referéndum de 6/12; entrada en vigor de 29/12."],["¿Cuántas disposiciones hay en cada grupo?","9 adicionales y 4 transitorias","9 adicionales y 5 transitorias","4 adicionales y 9 transitorias","4 adicionales y 5 transitorias",2,"4 adicionales, 9 transitorias, 1 derogatoria y 1 final."],["¿Cuál es la capital del Estado (artículo 5)?","La Comunidad de Madrid","La Región de Madrid","La villa de Madrid","Ninguna de las anteriores",2,"La capital es la villa de Madrid."]]};
const cfg={1:['Tarjetas Radar · Nivel 1','Recuerda las señales básicas. Piensa, revela y marca Fallé, Dudé o Acerté.'],2:['Repaso activo · Nivel 2','Practica precisión jurídica. Lee la pista, intenta responder y evalúate.'],3:['Test Radar · Nivel 3','Cinco preguntas reales de demostración. Selecciona una respuesta y comprueba.']};
const qs=new URLSearchParams(location.search);const lvl=[1,2,3].includes(Number(qs.get('nivel')))?Number(qs.get('nivel')):1;
document.body.className='level'+lvl;document.getElementById('title').textContent=cfg[lvl][0];document.getElementById('desc').textContent=cfg[lvl][1];
const list=DB[lvl],KEY='oporadar-tema1-qr-nivel'+lvl;let ix=0,ok=0,dub=0,fail=0,chosen=null,seen=false;
function action(text,fn,kind){const b=document.createElement('button');b.textContent=text;if(kind)b.className=kind;b.onclick=fn;document.getElementById('actions').append(b)}
function draw(){const q=list[ix];document.getElementById('actions').replaceChildren();document.getElementById('answer').classList.add('hidden');document.getElementById('choices').replaceChildren();document.getElementById('choices').classList.add('hidden');document.getElementById('feedback').classList.add('hidden');document.getElementById('fill').style.width=(100*ix/list.length)+'%';document.getElementById('counter').textContent=(ix+1)+' / '+list.length;document.getElementById('kind').textContent=lvl===3?'PREGUNTA REAL · PRUEBA':(lvl===1?'COMPRENDER':'ESTUDIAR');document.getElementById('question').textContent=q[0];chosen=null;seen=false;
if(lvl===3){document.getElementById('choices').classList.remove('hidden');q.slice(1,5).forEach((option,i)=>{const b=document.createElement('button');b.className='choice';b.textContent=String.fromCharCode(65+i)+'. '+option;b.onclick=()=>select(i);document.getElementById('choices').append(b)});}
else{action('Ver respuesta',()=>{seen=true;document.getElementById('answer').textContent=q[1];document.getElementById('answer').classList.remove('hidden');document.getElementById('actions').replaceChildren();action('Fallé',()=>next('fail'),'bad');action('Dudé',()=>next('doubt'),'doubt');action('Acerté',()=>next('ok'),'good')});}}
function select(i){if(seen)return;seen=true;chosen=i;const q=list[ix],answer=q[5];const buttons=[...document.querySelectorAll('.choice')];buttons.forEach((b,k)=>{b.disabled=true;if(k===answer)b.classList.add('selected');if(i===k&&k!==answer)b.classList.add('incorrect')});document.getElementById('answer').textContent=q[6];document.getElementById('answer').classList.remove('hidden');action('Continuar',()=>next(i===answer?'ok':'fail'));}
function next(t){if(t==='ok')ok++;else if(t==='doubt')dub++;else fail++;ix++;try{localStorage.setItem(KEY,JSON.stringify({completed:ix,ok,fail,dub,at:new Date().toISOString()}))}catch(_){}if(ix<list.length)draw();else done()}
function done(){document.getElementById('fill').style.width='100%';document.getElementById('counter').textContent='Actividad completada';document.getElementById('kind').textContent='RESULTADO';document.getElementById('question').textContent='Señal completada';document.getElementById('choices').classList.add('hidden');document.getElementById('answer').classList.remove('hidden');document.getElementById('answer').textContent='Acertadas: '+ok+' · Dudosas: '+dub+' · Falladas: '+fail;document.getElementById('actions').replaceChildren();action('Repetir actividad',()=>{ix=0;ok=0;dub=0;fail=0;draw()})}
draw();
</script></body></html>
